name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: TypeScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - name: App unit tests (jest)
        run: npm test --workspace vaaluation-app

  macos-build:
    name: macOS native build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pods
        working-directory: apps/macos
        run: pod install --project-directory=macos
      - name: Build (Debug, unsigned)
        run: |
          xcodebuild -workspace apps/macos/macos/Vaaluation.xcworkspace \
            -scheme Vaaluation-macOS \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

  windows-build:
    name: Windows portable build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run package:windows
      - name: Smoke test the packaged app and worker
        shell: pwsh
        run: |
          Expand-Archive -Path dist/ExileWorth-Windows-x64.zip -DestinationPath dist/smoke
          $appDir = Resolve-Path dist/smoke/ExileWorth-Windows-x64
          $reply = '{"action":"check","preferred":null,"text":"invalid item"}' |
            & "$appDir/node.exe" "$appDir/worker.cjs" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $reply.error) { throw 'Worker did not respond' }
          # Use deterministic trade results in the isolated desktop test only.
          Copy-Item apps/windows/test/desktop/worker-fixture.cjs "$appDir/worker.cjs"
          dotnet run --project apps/windows/test/desktop/DesktopTest.csproj -- "$appDir/ExileWorth.exe" "$PWD/dist/windows-overlay.png" "$PWD/dist/windows-desktop.png"
          if ($LASTEXITCODE -ne 0) { throw 'Windows shortcut or overlay test failed' }
          Copy-Item apps/windows/test/desktop/exchange-snapshot.json "$appDir/exchange-snapshot.json"
          dotnet run --project apps/windows/test/desktop/DesktopTest.csproj -- --exchange "$appDir/ExileWorth.exe" "$PWD/dist/windows-exchange-overlay.png" "$PWD/dist/windows-exchange-desktop.png"
          if ($LASTEXITCODE -ne 0) { throw 'Windows exchange captures failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: ExileWorth-Windows-x64
          path: dist/ExileWorth-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-overlay-screenshot
          path: |
            dist/windows-overlay.png
            dist/windows-desktop.png
            dist/windows-exchange-overlay.png
            dist/windows-exchange-desktop.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Windows-overlay-failure
          path: dist/windows-overlay-failure.png
          if-no-files-found: ignore
