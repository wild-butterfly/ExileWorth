name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - scripts/check-website.py
      - assets/app-icon.svg
      - apps/macos/macos/Vaaluation-macOS/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png
      - docs/screenshots/**
      - docs/social-preview.jpg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp -R website/. _site/
          cp apps/macos/macos/Vaaluation-macOS/Assets.xcassets/AppIcon.appiconset/icon_128x128@2x.png _site/assets/app-icon.png
          # Keep PNG URLs available for older cached pages and external image links.
          cp docs/screenshots/price-check.png _site/assets/price-check.png
          cp docs/screenshots/trades.png _site/assets/trades.png
          cp docs/social-preview.jpg _site/assets/social-preview.jpg
      - name: Validate website SEO and internal links
        run: python3 scripts/check-website.py _site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Notify IndexNow search engines
        # Bing (and DuckDuckGo, which uses it), Yandex and others re-crawl the
        # listed pages; failure here never fails the deploy.
        continue-on-error: true
        run: |
          KEY=$(basename "$(ls website/*.txt | grep -E '/[0-9a-f]{32}\.txt$')" .txt)
          python3 - "$KEY" <<'PY'
          import json, sys, urllib.request
          key = sys.argv[1]
          urls = [u.strip() for u in open("website/sitemap.txt") if u.strip()]
          body = json.dumps({
              "host": "wild-butterfly.github.io",
              "key": key,
              "keyLocation": f"https://wild-butterfly.github.io/ExileWorth/{key}.txt",
              "urlList": urls,
          }).encode()
          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow", data=body,
              headers={"Content-Type": "application/json; charset=utf-8"})
          print("IndexNow:", urllib.request.urlopen(request, timeout=30).status)
          PY
